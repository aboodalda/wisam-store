<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وسام ستور | Wisam Store</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <header class="store-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">W</span>
      <span><b>وسام</b> <em>ستور</em><small>WISAM STORE</small></span>
    </a>
    <button class="cart-button" id="cartButton">السلة 🛒 <span id="cartCount">0</span></button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">WISAM STORE · PREMIUM TECH</span>
        <h1>تقنية تليق<br><strong>بذوقك.</strong></h1>
        <p>أحدث الجوالات والساعات وأجهزة الألعاب، مع تجربة شراء راقية وأنيقة.</p>
        <a class="primary-btn" href="#products">اكتشف المنتجات ←</a>
      </div>
      <div class="hero-orbit hero-orbit-one"></div>
      <div class="hero-orbit hero-orbit-two"></div>
    </section>

    <section class="section" id="products">
      <div class="section-heading">
        <span class="eyebrow">OUR PRODUCTS</span>
        <h2>أحدث المنتجات</h2>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="productModal" class="modal">
    <div class="modal-box">
      <button id="closeProductModal" class="modal-close">×</button>
      <div id="productDetails"></div>
    </div>
  </div>

  <div id="cartDrawer" class="drawer">
    <div class="drawer-head">
      <h2>سلة المشتريات</h2>
      <button id="closeCart">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <strong>الإجمالي: <span id="cartTotal">0</span> ر.س</strong>
      <button id="checkoutButton" class="primary-btn">إتمام الطلب</button>
    </div>
  </div>
  <div id="overlay" class="overlay"></div>

  <script src="store.js"></script>
</body>
</html>
