<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وسام ستور | لوحة التحكم</title>
  <link rel="stylesheet" href="owner.css">
</head>

<body>

  <aside class="sidebar">

    <div class="owner-brand">
      <span>W</span>
      <div>
        <b>وسام ستور</b>
        <small>OWNER PANEL</small>
      </div>
    </div>

    <div class="owner-name">
      <strong>مدير المتجر</strong>
      <small>وسام ستور</small>
    </div>

    <nav>
      <a class="active" href="#dashboard">الرئيسية</a>
      <a href="#products">المنتجات</a>
      <a href="#orders">
        <span>الطلبات</span>
        <span id="navOrderCount" class="nav-badge">0</span>
      </a>
      <a href="#add">إضافة منتج</a>
    </nav>

    <a class="back-store" href="index.html">
      ← العودة للمتجر
    </a>

  </aside>


  <main class="owner-main">

    <header class="top">

      <div>
        <span class="eyebrow">WISAM STORE</span>
        <h1>لوحة التحكم</h1>
      </div>

      <a href="index.html" class="preview">
        ↗ معاينة المتجر
      </a>

    </header>


    <!-- الإحصائيات -->

    <section id="dashboard" class="stats">

      <div>
        <span>إجمالي المنتجات</span>
        <b id="totalProducts">0</b>
        <small>منتج</small>
      </div>

      <div>
        <span>إجمالي الطلبات</span>
        <b id="totalOrders">0</b>
        <small>طلب</small>
      </div>

      <div>
        <span>إجمالي المبيعات</span>
        <b id="totalSales">0 ر.س</b>
        <small>حسب الطلبات</small>
      </div>

    </section>


    <!-- الطلبات -->

    <section id="orders" class="panel orders-panel">

      <div class="panel-title">

        <div>
          <span class="eyebrow">ORDERS</span>
          <h2>الطلبات</h2>
        </div>

        <button class="refresh" onclick="renderOrders()">
          ↻ تحديث
        </button>

      </div>


      <div class="order-toolbar">

        <button class="filter active"
          onclick="filterOrders('all',this)">
          الكل
        </button>

        <button class="filter"
          onclick="filterOrders('new',this)">
          جديدة
        </button>

        <button class="filter"
          onclick="filterOrders('processing',this)">
          قيد التجهيز
        </button>

        <button class="filter"
          onclick="filterOrders('delivered',this)">
          تم التسليم
        </button>

        <button class="filter"
          onclick="filterOrders('cancelled',this)">
          ملغاة
        </button>

      </div>

      <div id="ordersList"></div>

    </section>


    <!-- المنتجات -->

    <section id="products" class="panel">

      <div class="panel-title">

        <h2>المنتجات</h2>

        <button onclick="document.getElementById('add').scrollIntoView()">
          + إضافة منتج
        </button>

      </div>

      <div id="ownerProducts"></div>

    </section>


    <!-- إضافة منتج -->

    <section id="add" class="panel">

      <div class="panel-title">
        <h2>إضافة منتج جديد</h2>
      </div>


      <form id="productForm">

        <label>
          اسم المنتج

          <input
            id="name"
            required
            placeholder="مثال: iPhone 16 Pro"
          >
        </label>


        <label>
          السعر

          <input
            id="price"
            type="number"
            min="0"
            required
            placeholder="1299"
          >
        </label>


        <label>
          الوصف

          <input
            id="description"
            placeholder="وصف مختصر للمنتج"
          >
        </label>


        <label>
          رمز المنتج

          <input
            id="icon"
            placeholder="📱"
          >
        </label>


        <!-- اختيار الصورة من الجهاز -->

        <label class="image-upload-label">

          صورة المنتج

          <div class="image-upload">

            <input
              id="imageFile"
              type="file"
              accept="image/*"
            >

            <div class="upload-content">

              <div class="upload-icon">
                🖼️
              </div>

              <strong>
                اختر صورة المنتج
              </strong>

              <span>
                من الجوال أو الكمبيوتر
              </span>

            </div>

          </div>

        </label>


        <!-- معاينة الصورة -->

        <div
          id="imagePreview"
          class="image-preview"
        >
          <span>
            ستظهر معاينة الصورة هنا
          </span>
        </div>


        <!-- رابط الصورة اختياري -->

        <label>

          رابط الصورة
          <small class="optional">
            اختياري
          </small>

          <input
            id="image"
            placeholder="https://..."
          >

        </label>


        <button
          class="save"
          type="submit"
        >
          حفظ المنتج
        </button>

      </form>

    </section>

  </main>


  <!-- تفاصيل الطلب -->

  <div
    id="orderModal"
    class="order-modal"
  >

    <div class="order-modal-box">

      <button
        class="modal-close"
        onclick="closeOrder()"
      >
        ×
      </button>

      <div id="orderDetails"></div>

    </div>

  </div>


  <script src="owner.js"></script>

</body>
</html>
