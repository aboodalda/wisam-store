<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وسام ستور | لوحة التحكم</title>
  <link rel="stylesheet" href="owner.css">
</head>
<body>
  <aside class="sidebar">
    <div class="owner-brand"><span>W</span><div><b>وسام ستور</b><small>OWNER PANEL</small></div></div>
    <div class="owner-name"><strong>مدير المتجر</strong><small>وسام ستور</small></div>
    <nav>
      <a class="active" href="#dashboard">الرئيسية</a>
      <a href="#products">المنتجات</a>
      <a href="#add">إضافة منتج</a>
    </nav>
    <a class="back-store" href="index.html">← العودة للمتجر</a>
  </aside>

  <main class="owner-main">
    <header class="top"><div><span class="eyebrow">WISAM STORE</span><h1>لوحة التحكم</h1></div><a href="index.html" class="preview">↗ معاينة المتجر</a></header>

    <section id="dashboard" class="stats">
      <div><span>إجمالي المنتجات</span><b id="totalProducts">0</b><small>منتج</small></div>
      <div><span>إجمالي الطلبات</span><b>0</b><small>طلب</small></div>
      <div><span>إجمالي المبيعات</span><b>0 ر.س</b><small>حسب الطلبات</small></div>
    </section>

    <section id="products" class="panel">
      <div class="panel-title"><h2>المنتجات</h2><button onclick="document.getElementById('add').scrollIntoView()">+ إضافة منتج</button></div>
      <div id="ownerProducts"></div>
    </section>

    <section id="add" class="panel">
      <div class="panel-title"><h2>إضافة منتج جديد</h2></div>
      <form id="productForm">
        <label>اسم المنتج<input id="name" required placeholder="مثال: iPhone 16 Pro"></label>
        <label>السعر<input id="price" type="number" min="0" required placeholder="1299"></label>
        <label>الوصف<input id="description" placeholder="وصف مختصر للمنتج"></label>
        <label>رمز المنتج<input id="icon" placeholder="📱"></label>
        <label>رابط صورة المنتج<input id="image" placeholder="https://..."></label>
        <button class="save" type="submit">حفظ المنتج</button>
      </form>
    </section>
  </main>
  <script src="owner.js"></script>
</body>
</html>
